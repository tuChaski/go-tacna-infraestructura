name: gotacna-local

services:
  postgres:
    image: postgis/postgis:16-3.4-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-gotacna_db}
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-local-dev-password}
    ports:
      - "127.0.0.1:${DB_PUBLISHED_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init-postgis.sql:/docker-entrypoint-initdb.d/10-postgis.sql:ro
    networks:
      - gotacna-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  backend:
    build:
      context: ./docker/php
    restart: unless-stopped
    init: true
    environment:
      APP_NAME: Go-Tacna
      APP_ENV: local
      APP_KEY: "${APP_KEY:-base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=}"
      APP_DEBUG: "true"
      APP_URL: ${APP_URL:-http://localhost:8001}
      LOG_CHANNEL: stderr
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: ${DB_DATABASE:-gotacna_db}
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-local-dev-password}
      SESSION_DRIVER: file
      CACHE_STORE: file
      QUEUE_CONNECTION: sync
    volumes:
      - type: bind
        source: ${BACKEND_PATH:-../go-tacna-backend/gotacna-backend-core}
        target: /var/www/html
      - backend_vendor:/var/www/html/vendor
      - backend_bootstrap:/var/lib/gotacna
    networks:
      - gotacna-net
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8000/up >/dev/null || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 30s

  websocket:
    build:
      context: ./docker/node
    restart: unless-stopped
    init: true
    environment:
      PORT: 3001
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5173}
      NODE_PATH: /app/node_modules
    volumes:
      - type: bind
        source: ${LOCATION_PATH:-../go-tacna-backend/go-tacna-location-service}
        target: /app
      - location_node_modules:/app/node_modules
    networks:
      - gotacna-net
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3001/health').then((r) => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))"
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  frontend:
    build:
      context: ${FRONTEND_PATH:-../go-tacna-frontend}
      dockerfile: ../go-tacna-infraestructura/docker/frontend/Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api/v1}
        VITE_WS_URL: ${VITE_WS_URL:-http://localhost:8001}
    restart: unless-stopped
    networks:
      - gotacna-net
    expose:
      - "80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/healthz || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    depends_on:
      backend:
        condition: service_healthy
      websocket:
        condition: service_healthy

  api-gateway:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:${GATEWAY_PUBLISHED_PORT:-8001}:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - gotacna-net
    depends_on:
      backend:
        condition: service_healthy
      websocket:
        condition: service_healthy
      frontend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/healthz || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

networks:
  gotacna-net:
    driver: bridge

volumes:
  postgres_data:
  backend_vendor:
  backend_bootstrap:
  location_node_modules: