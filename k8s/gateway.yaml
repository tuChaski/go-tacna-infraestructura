apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
      containers:
        - name: gateway
          image: ghcr.io/tuchaski/gotacna-api-gateway:REPLACE_WITH_TAG
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: APP_ENV
              value: production
            - name: APP_DEBUG
              value: "false"
            - name: APP_URL
              value: https://go-tacna.site
            - name: LOG_CHANNEL
              value: stderr
            - name: DB_CONNECTION
              value: sqlite
            - name: DB_DATABASE
              value: ":memory:"
            - name: SESSION_DRIVER
              value: array
            - name: CACHE_STORE
              value: array
            - name: QUEUE_CONNECTION
              value: sync
            - name: CORE_API_URL
              value: http://backend:8000
            - name: CORE_API_TIMEOUT
              value: "30"
            - name: CORE_API_VERIFY_TLS
              value: "true"
            - name: CORS_ALLOWED_ORIGINS
              value: https://go-tacna.site
          envFrom:
            - secretRef:
                name: gotacna-secrets
          readinessProbe:
            httpGet:
              path: /up
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /up
              port: http
            periodSeconds: 20
            timeoutSeconds: 3
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
spec:
  selector:
    app: gateway
  ports:
    - name: http
      port: 8000
      targetPort: http
